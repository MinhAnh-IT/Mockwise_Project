      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          # Social-login client IDs are public (not secrets) and must be baked
          # in at build time. Set as repo Variables under Settings → Secrets and
          # variables → Actions → Variables.
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ vars.VITE_GITHUB_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ─── Deploy to VPS ─────────────────────────────────────────────
  # Runs when at least one build succeeded (no failures allowed).
  deploy:
    name: Deploy to VPS
    needs:
      - detect-changes
      - build-api-gateway
      - build-iam-service
      - build-user-profile-service
      - build-mail-service
      - build-judge-service
      - build-question-bank-service
      - build-storage-service
      - build-tts-stt-service
      - build-interview-service
      - build-practice-service
      - build-ai-service
      - build-frontend
    # Run if: no job failed AND either a build succeeded OR a config-only change
    # exists (swagger-ui / nginx configs don't trigger any build job).
    if: |
      always() &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (contains(needs.*.result, 'success') ||
       needs.detect-changes.outputs.swagger-config == 'true' ||
       needs.detect-changes.outputs.nginx-config == 'true')
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Compute which services were actually rebuilt so we only restart those.
      # swagger-ui / nginx don't go through a build job — they're image-only or
      # config-only, and need restarting whenever compose/spec/nginx configs change
      # so the new env vars and mounted files are picked up.
      - name: Compute changed services
        id: services
        run: |
          list=""
          [ "${{ needs.detect-changes.outputs.api-gateway }}"          = "true" ] && list="$list api-gateway"
          [ "${{ needs.detect-changes.outputs.iam-service }}"          = "true" ] && list="$list iam-service"
          [ "${{ needs.detect-changes.outputs.user-profile-service }}" = "true" ] && list="$list user-profile-service"
          [ "${{ needs.detect-changes.outputs.mail-service }}"         = "true" ] && list="$list mail-service"
          [ "${{ needs.detect-changes.outputs.judge-service }}"        = "true" ] && list="$list judge-service"
          [ "${{ needs.detect-changes.outputs.question-bank-service }}" = "true" ] && list="$list question-bank-service"
          [ "${{ needs.detect-changes.outputs.storage-service }}"      = "true" ] && list="$list storage-service"
          [ "${{ needs.detect-changes.outputs.tts-stt-service }}"      = "true" ] && list="$list tts-stt-service"
          [ "${{ needs.detect-changes.outputs.interview-service }}"    = "true" ] && list="$list interview-service"
          [ "${{ needs.detect-changes.outputs.practice-service }}"     = "true" ] && list="$list practice-service"
          [ "${{ needs.detect-changes.outputs.ai-service }}"           = "true" ] && list="$list ai-service"
          [ "${{ needs.detect-changes.outputs.frontend }}"             = "true" ] && list="$list frontend"
          [ "${{ needs.detect-changes.outputs.swagger-config }}"       = "true" ] && list="$list swagger-ui"
          [ "${{ needs.detect-changes.outputs.nginx-config }}"         = "true" ] && list="$list nginx"
          echo "list=${list## }" >> $GITHUB_OUTPUT
          echo "Deploying: ${list## }"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs:     CHANGED_SERVICES
          script: |
            set -e
            cd /opt/mockwise

            # Sync config files (nginx, docker-compose, etc.) to latest main
            git fetch https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }}.git main
            git reset --hard FETCH_HEAD

            # Ensure shared network exists (idempotent)
            docker network create mockwise-judge-net 2>/dev/null || true

            # Login GHCR
            echo "${{ secrets.GIT_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.repository_owner }} --password-stdin

            # Pull only the images that were rebuilt
            for svc in ${{ steps.services.outputs.list }}; do
              echo "Pulling $svc..."
              docker compose -f docker/docker-compose.prod.yml --env-file .env pull "$svc"
            done

            # Restart only changed services (zero downtime for others)
            docker compose -f docker/docker-compose.prod.yml --env-file .env \
              up -d --no-deps ${{ steps.services.outputs.list }}

            # Validate, then hot-reload nginx so the freshly git-reset config
            # AND new upstream container IPs both take effect (resolver cache can
            # otherwise keep dead IPs after a recreate, causing 502).
            # Use `compose exec` so this resolves by service name instead of a
            # hardcoded container name, and DO surface failures: a silently-failed
            # reload (the old `2>/dev/null || true`) means a config change that
            # was deployed to disk but never actually applied.
            docker compose -f docker/docker-compose.prod.yml --env-file .env exec -T nginx nginx -t
            docker compose -f docker/docker-compose.prod.yml --env-file .env exec -T nginx nginx -s reload

            docker image prune -f
            echo "Deploy completed: $(date)"

      - name: Verify
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker compose -f /opt/mockwise/docker/docker-compose.prod.yml \
              ps --format "table {{.Name}}\t{{.Status}}"
