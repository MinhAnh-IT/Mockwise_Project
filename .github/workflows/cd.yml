name: CD — Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Detect which services changed ─────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api-gateway:          ${{ steps.filter.outputs.api-gateway }}
      iam-service:          ${{ steps.filter.outputs.iam-service }}
      user-profile-service: ${{ steps.filter.outputs.user-profile-service }}
      mail-service:         ${{ steps.filter.outputs.mail-service }}
      judge-service:        ${{ steps.filter.outputs.judge-service }}
      question-bank-service: ${{ steps.filter.outputs.question-bank-service }}
      storage-service:      ${{ steps.filter.outputs.storage-service }}
      tts-stt-service:      ${{ steps.filter.outputs.tts-stt-service }}
      interview-service:    ${{ steps.filter.outputs.interview-service }}
      practice-service:     ${{ steps.filter.outputs.practice-service }}
      ai-service:           ${{ steps.filter.outputs.ai-service }}
      frontend:             ${{ steps.filter.outputs.frontend }}
      swagger-config:       ${{ steps.filter.outputs.swagger-config }}
      nginx-config:         ${{ steps.filter.outputs.nginx-config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/pom.xml'
            iam-service:
              - 'services/iam-service/**'
              - 'services/pom.xml'
            user-profile-service:
              - 'services/user-profile-service/**'
              - 'services/pom.xml'
            mail-service:
              - 'services/mail-service/**'
              - 'services/pom.xml'
            judge-service:
              - 'services/judge-service/**'
            question-bank-service:
              - 'services/question-bank-service/**'
              - 'services/pom.xml'
            storage-service:
              - 'services/storage-service/**'
              - 'services/pom.xml'
            tts-stt-service:
              - 'services/tts-stt-service/**'
              - 'services/pom.xml'
            interview-service:
              - 'services/interview-service/**'
              - 'services/pom.xml'
            practice-service:
              - 'services/practice-service/**'
              - 'services/pom.xml'
            ai-service:
              - 'AI/**'
            frontend:
              - 'frontend/**'
            swagger-config:
              - 'docker/docker-compose.prod.yml'
              - 'api-spec/**'
            nginx-config:
              - 'docker/docker-compose.prod.yml'
              - 'nginx/**'

  # ─── Shared build step (reusable template via composite) ───────
  # Each service has its own job so we can condition on detect-changes.
  # Jobs run in parallel automatically.

  build-api-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image prefix
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY_OWNER,,}/mockwise_project" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: services
          file: services/api-gateway/Dockerfile
          push: true
          build-args: PACKAGES_TOKEN=${{ secrets.PACKAGES_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}

  build-iam-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.iam-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image prefix
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY_OWNER,,}/mockwise_project" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
