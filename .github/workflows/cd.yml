            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/question-bank-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/question-bank-service:${{ github.sha }}

  build-storage-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.storage-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
