name: CD — Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Build & Push all services to GHCR ─────────────────────
  build-push:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: services
            dockerfile: services/api-gateway/Dockerfile
          - name: iam-service
            context: services
            dockerfile: services/iam-service/Dockerfile
          - name: user-profile-service
            context: services
            dockerfile: services/user-profile-service/Dockerfile
          - name: mail-service
            context: services
            dockerfile: services/mail-service/Dockerfile
          - name: ai-evaluation
            context: AI/AI-Evaluation
            dockerfile: AI/AI-Evaluation/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR yêu cầu lowercase — convert owner name
      - name: Set lowercase image prefix
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY_OWNER,,}/mockwise_project" >> $GITHUB_ENV

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: |
            PACKAGES_TOKEN=${{ secrets.PACKAGES_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,scope=${{ matrix.service.name }},mode=max

  # ─── Deploy to VPS ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # Sync code to latest main (force reset to avoid diverge issues)
            cd /opt/mockwise
            git fetch https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }}.git main
            git reset --hard FETCH_HEAD

            # Login GHCR to pull private images
            echo "${{ secrets.GIT_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.repository_owner }} --password-stdin

            # Pull images and restart
            docker compose -f docker/docker-compose.prod.yml \
              --env-file .env pull

            docker compose -f docker/docker-compose.prod.yml \
              --env-file .env up -d --remove-orphans

            # clean images
            docker image prune -f

            echo "Deploy completed: $(date)"

      - name: Verify
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker compose -f /opt/mockwise/docker/docker-compose.prod.yml ps
