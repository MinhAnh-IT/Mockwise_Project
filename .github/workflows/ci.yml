name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      iam-service: ${{ steps.filter.outputs.iam-service }}
      user-profile-service: ${{ steps.filter.outputs.user-profile-service }}
      mail-service: ${{ steps.filter.outputs.mail-service }}
      ai-evaluation: ${{ steps.filter.outputs.ai-evaluation }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/pom.xml'
            iam-service:
              - 'services/iam-service/**'
              - 'services/pom.xml'
            user-profile-service:
              - 'services/user-profile-service/**'
              - 'services/pom.xml'
            mail-service:
              - 'services/mail-service/**'
              - 'services/pom.xml'
            ai-evaluation:
              - 'AI/AI-Evaluation/**'
            frontend:
              - 'frontend/**'

  build-api-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build & test
        run: mvn -B -pl api-gateway clean package -DskipTests
        working-directory: services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -f services/api-gateway/Dockerfile --build-arg PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }} -t mockwise/api-gateway:${{ github.sha }} services

  build-iam-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.iam-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build & test
        run: mvn -B -pl iam-service clean package -DskipTests
        working-directory: services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -f services/iam-service/Dockerfile --build-arg PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }} -t mockwise/iam-service:${{ github.sha }} services

  build-user-profile-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-profile-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build & test
        run: mvn -B -pl user-profile-service clean package -DskipTests
        working-directory: services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -f services/user-profile-service/Dockerfile --build-arg PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }} -t mockwise/user-profile-service:${{ github.sha }} services

  build-mail-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.mail-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build & test
        run: mvn -B -pl mail-service clean package -DskipTests
        working-directory: services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -f services/mail-service/Dockerfile --build-arg PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }} -t mockwise/mail-service:${{ github.sha }} services

  build-ai-evaluation:
    needs: detect-changes
    if: needs.detect-changes.outputs.ai-evaluation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: AI/AI-Evaluation
      - name: Build Docker image
        run: docker build -t mockwise/ai-evaluation:${{ github.sha }} AI/AI-Evaluation

