openapi: 3.0.3

info:
  title: MockWise — Storage Service
  version: 1.0.0
  description: |
    Manages object storage on MinIO for two kinds of assets:

    - **Interview videos** — uploaded by candidates during a session. Bytes go directly
      from the browser to MinIO via a short-lived **presigned PUT URL**, never through
      this service. Storage-service only reserves the slot, validates ownership, and
      confirms the upload finished.

    - **Question audio** — TTS audio of a question. Generated by the tts-stt service
      and pushed here (server-to-server). When a candidate opens a question, the
      interview-service is the ACL gatekeeper: it verifies the user owns an active
      session containing the question, then asks storage-service for a short-lived
      **presigned GET URL** which the browser plays directly from MinIO.

    All public traffic goes through the API Gateway: **`http://localhost:8888`**
    Direct service port (dev only): `8085` (context-path: `/api/v1/storage`)

    ### Two classes of endpoints

    | Class | Path prefix | Auth | Reachable from |
    |-------|-------------|------|----------------|
    | Public | `/api/v1/storage/uploads/**` | JWT (`Bearer`) propagated by gateway | Public network via gateway |
    | Internal | `/api/v1/storage/internal/**` | `X-Internal-Auth: <shared-secret>` | Internal network only — gateway returns 404 for these paths |

    ### Authorization model

    - **Object keys are server-generated** — clients cannot pick the storage path,
      which prevents enumeration / cross-user access by URL guessing.
    - **Ownership is enforced at upload completion** — only the user who reserved
      the slot can mark it READY.
    - **Presigned download TTL is capped per kind** — audio max 60s, video max 30 min,
      regardless of what the caller requests, so leaked URLs expire quickly.
    - **The interview-service is the ACL authority for downloads** — storage-service
      trusts internal callers (after the X-Internal-Auth handshake) to have already
      verified the end-user is allowed.

servers:
  - url: http://localhost:8888
    description: Local via API Gateway (public endpoints only)
  - url: http://localhost:8085
    description: Direct (dev only — required for /internal/** endpoints)

tags:
  - name: Uploads
    description: User-facing video upload flow (presigned PUT)
  - name: Internal
    description: Service-to-service endpoints — requires X-Internal-Auth header
  - name: Health
    description: Liveness probe

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalAuth:
      type: apiKey
      in: header
      name: X-Internal-Auth
      description: |
        Shared secret for service-to-service calls. The api-gateway strips this header
        from any incoming public request, so it can only be set by callers that already
        live on the internal network (e.g. interview-service, tts-stt service).

  schemas:
    # ── Enums ──────────────────────────────────────────────────────────────────

    StorageKind:
      type: string
      enum: [INTERVIEW_VIDEO, QUESTION_AUDIO, USER_AVATAR]

    StorageStatus:
      type: string
      enum: [PENDING_UPLOAD, READY, FAILED]
      description: |
        - `PENDING_UPLOAD` — slot reserved, waiting for client to PUT bytes to MinIO.
        - `READY` — bytes confirmed in MinIO; safe to download.
        - `FAILED` — upload was rejected (size mismatch, expired, etc.).

    # ── Requests ──────────────────────────────────────────────────────────────

    CreateVideoUploadRequest:
      type: object
      required: [sessionId, contentType, sizeBytes]
      properties:
        sessionId:
          type: string
          description: Interview session this video belongs to.
          example: "01JX9P2K8R3C4FZ8N7H5BWAQ12"
        contentType:
          type: string
          description: |
            MIME type of the file the client will PUT. Allowed values:
            `video/webm`, `video/mp4`, `video/x-matroska`, `video/quicktime`.
          example: "video/webm"
        sizeBytes:
          type: integer
          format: int64
          description: |
            Declared file size. Capped at 500 MB. Verified against actual MinIO
            object size at completion — mismatch causes the upload to be rejected.
          example: 12582912

    InternalDownloadUrlRequest:
      type: object
      required: [kind, objectKey, ttlSeconds]
      properties:
        kind:
          $ref: '#/components/schemas/StorageKind'
        objectKey:
          type: string
          description: |
            Object key (path inside the bucket) returned at upload time.
            For audio this is what question-bank stores in `audio_key`.
          example: "audio/8f1c3a4d-9a2b-4e7f-8c1d-2a4b6c8e0f12"
        ttlSeconds:
          type: integer
          minimum: 1
          description: |
            Requested URL lifetime. Server **caps** the value per kind:
            audio ≤ 60s, avatar ≤ 600s, video ≤ 1800s. Values above the cap are silently truncated.
          example: 60

    # ── Responses (raw payloads — wrapped in ApiResponse below) ───────────────

    VideoUploadResponse:
      type: object
      properties:
        objectId:
          type: string
          description: Internal id used to complete the upload.
          example: "0a1b2c3d-4e5f-6789-abcd-ef0123456789"
        bucket:
          type: string
          example: "interview-videos"
        objectKey:
          type: string
          description: Server-built key — `{userId}/{sessionId}/{uuid}`.
          example: "u-7f3a/sess-01JX9P/8f1c3a4d-9a2b-4e7f-8c1d-2a4b6c8e0f12"
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL the client uses to upload bytes directly to MinIO.
        expiresAt:
          type: string
          format: date-time

    StorageObjectResponse:
      type: object
      properties:
        objectId:
          type: string
        kind:
          $ref: '#/components/schemas/StorageKind'
        bucket:
          type: string
        objectKey:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StorageStatus'
        sessionId:
          type: string
          nullable: true
        questionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    QuestionAudioUploadResponse:
      type: object
      properties:
        objectId:
          type: string
        bucket:
          type: string
          example: "question-audio"
        objectKey:
          type: string
          description: |
            Pure UUID under the `audio/` prefix. Persist this in
            `question-bank.<table>.audio_key`.
          example: "audio/8f1c3a4d-9a2b-4e7f-8c1d-2a4b6c8e0f12"
        sizeBytes:
          type: integer
          format: int64

    PresignedUrlResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned GET URL pointing at MinIO (or its public endpoint).
        expiresAt:
          type: string
          format: date-time

    # ── Standard envelope ─────────────────────────────────────────────────────

    ApiResponse:
      type: object
      required: [success, code]
      properties:
        success:
          type: boolean
        code:
          type: integer
        message:
          type: string
          nullable: true
        data:
          nullable: true

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
      example:
        success: false
        code: 4040
        message: "Storage object not found"
        data: null

  responses:
    BadRequest:
      description: Validation error or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing/invalid bearer token (public) or X-Internal-Auth (internal)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated, but the caller is not the owner of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Object does not exist or is not yet READY
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Object is already in a terminal state (e.g. already READY)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /api/v1/storage/health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/storage/uploads/videos:
    post:
      tags: [Uploads]
      summary: Reserve a video upload slot and get a presigned PUT URL
      description: |
        Creates a `PENDING_UPLOAD` record owned by the authenticated user,
        and returns a presigned PUT URL with TTL = 10 minutes.

        ### Client flow
        1. `POST /uploads/videos` → receive `{ objectId, uploadUrl, expiresAt }`
        2. `PUT <uploadUrl>` directly to MinIO with the file bytes
        3. `POST /uploads/videos/{objectId}/complete` to flip status to `READY`

        Object key is built server-side as `{userId}/{sessionId}/{uuid}` —
        clients have no control over the storage path.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoUploadRequest'
      responses:
        '200':
          description: Upload reserved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VideoUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/storage/uploads/videos/{objectId}/complete:
    post:
      tags: [Uploads]
      summary: Confirm a video upload has finished
      description: |
        Stat-s the object in MinIO, verifies the actual size matches what the client
        declared at reservation time, then flips status to `READY`.

        Only the user who originally reserved the slot may complete it.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StorageObjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Declared size did not match the bytes actually stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage/uploads/avatars:
    post:
      tags: [Uploads]
      summary: Upload a user avatar (multipart)
      description: |
        Single-step multipart upload. The browser POSTs the image file to this
        endpoint and storage-service streams it through to MinIO server-side.

        Going through this service (rather than browser-direct presigned PUT)
        avoids two cross-origin issues that come up when the app runs over HTTPS
        but MinIO is exposed only over HTTP: mixed-content blocking and
        per-bucket CORS configuration. Avatars are capped at 5 MB so the extra
        server hop is cheap.

        After upload, send the returned `objectKey` to user-profile-service via
        `PATCH /profiles/{userId}` so the next profile fetch carries `avatarUrl`.

        Limits: max 5 MB, content-type ∈ `image/jpeg`, `image/png`, `image/webp`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StorageObjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/storage/uploads/avatars/me:
    get:
      tags: [Uploads]
      summary: Stream the authenticated user's latest avatar
      description: |
        Returns the bytes of the authenticated user's latest READY avatar.
        Server-side proxy to MinIO so the browser, which loads the app over
        HTTPS, never sees the HTTP-only MinIO host (avoids mixed-content
        blocking).

        Frontend builds a blob URL from this response and binds it to an
        `<img>`. A `?v=<key-suffix>` query string is appended by the profile
        API as a cache-buster — re-uploading produces a new key, hence a new
        URL, hence the browser refetches.

        Cache-Control: `private, max-age=600`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avatar bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png:  { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/storage/internal/question-audio:
    post:
      tags: [Internal]
      summary: Upload TTS audio for a question (service-to-service)
      description: |
        Called by tts-stt after generating an audio clip for a behavioral or core
        question. The returned `objectKey` is what the caller should persist into
        `question-bank.<table>.audio_key`.

        Reachable only from the internal network — the api-gateway returns 404 for
        any path containing `/internal/`.
      security:
        - internalAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [questionId, file]
              properties:
                questionId:
                  type: string
                  description: Question id this audio belongs to.
                file:
                  type: string
                  format: binary
                  description: |
                    Audio file. Allowed MIME types: `audio/mpeg`, `audio/mp4`,
                    `audio/wav`, `audio/ogg`, `audio/webm`. Max 25 MB.
      responses:
        '200':
          description: Audio stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuestionAudioUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/storage/internal/download-url:
    post:
      tags: [Internal]
      summary: Issue a short-lived presigned GET URL
      description: |
        Called by the interview-service **after** verifying the end-user is allowed
        to access the object (active session, ownership, etc.). Storage-service does
        not re-check ACL — it trusts the caller after the X-Internal-Auth handshake.

        TTL is server-capped per kind: audio ≤ 60s, avatar ≤ 10 minutes, video ≤ 30 minutes. Values
        above the cap are silently truncated; values below 1 are clamped to 1.

        Reachable only from the internal network.
      security:
        - internalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalDownloadUrlRequest'
      responses:
        '200':
          description: URL issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
