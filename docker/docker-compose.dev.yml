name: mockwise-dev

# Extends base compose with hot-reload volumes for local development
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up

services:
  api-gateway:
    command: npm run dev
    volumes:
      - ../services/api-gateway/src:/app/src:ro
    ports:
      - "3000:3000"

  ai-service:
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../AI/evaluator:/app/evaluator:ro
      - ../AI/generator:/app/generator:ro
      - ../AI/selector:/app/selector:ro
      - ../AI/models:/app/models:ro
      - ../AI/api.py:/app/api.py:ro
      - ../AI/main.py:/app/main.py:ro
      - ../AI/config.py:/app/config.py:ro
      - ../AI/llm.py:/app/llm.py:ro
    ports:
      - "8000:8000"

  frontend:
    command: npm run dev
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/public:/app/public:ro
    ports:
      - "5173:5173"

  nginx:
    ports:
      - "80:80"
