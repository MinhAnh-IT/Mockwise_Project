name: mockwise

# Production compose — uses pre-built images from GHCR.
# Infrastructure (MySQL, Redis, Kafka, MinIO) runs separately via Mockwise_db.
#
# Deploy:
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d

services:

  # ─── Spring Services (internal only, no ports exposed) ─────────
  iam-service:
    image: ghcr.io/minhanh-it/mockwise_project/iam-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/iam
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      JWT_COOKIE_SECURE: "false"
    networks: [internal-net]

  user-profile-service:
    image: ghcr.io/minhanh-it/mockwise_project/user-profile-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/user_profile
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      IAM_BASE_URL: http://iam-service:8081/api/v1/iam
    networks: [internal-net]
    depends_on: [iam-service]

  mail-service:
    image: ghcr.io/minhanh-it/mockwise_project/mail-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks: [internal-net]

  # ─── Question Bank Service (internal only) ─────────────────────
  question-bank-service:
    image: ghcr.io/minhanh-it/mockwise_project/question-bank-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Force prod so application-local.yml's hard-coded dev DB url
      # is not loaded on top of the env vars below.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/question_bank
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Sync TTS call after admin creates / updates a behavioral or core question.
      TTS_STT_SERVICE_URL: http://tts-stt-service:8086
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks: [internal-net]
    depends_on: [tts-stt-service]

  # ─── Storage Service (internal only) ───────────────────────────
  storage-service:
    image: ghcr.io/minhanh-it/mockwise_project/storage-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Force prod so application-local.yml's hard-coded dev values
      # (internal.auth.api-key=dev-internal-key-change-me) are not loaded.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/storage
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-${MINIO_ENDPOINT}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks: [internal-net]

  # ─── TTS-STT Service (internal only) ──────────────────────────
  tts-stt-service:
    image: ghcr.io/minhanh-it/mockwise_project/tts-stt-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Force prod so application-local.yml's hard-coded dev values
      # (storage-client.base-url, ffmpeg path, scoped api-keys) are not loaded.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/tts_stt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STORAGE_SERVICE_BASE_URL: http://storage-service:8085
      STORAGE_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      # Vietnamese-first defaults. The default voice (Rachel) is English-trained; for
      # natural Vietnamese pronunciation pick a Vietnamese-native voice from
      # https://elevenlabs.io/app/voice-library?language=vi and override via
      # ELEVENLABS_DEFAULT_VOICE_ID in .env.
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      # eleven_turbo_v2_5 honours language_code (multilingual_v2 ignores it). Combined
      # with ELEVENLABS_DEFAULT_LANGUAGE_CODE=vi this stops the model from auto-detecting
      # short Vietnamese sentences as Indonesian / Thai.
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_turbo_v2_5}
      ELEVENLABS_DEFAULT_LANGUAGE_CODE: ${ELEVENLABS_DEFAULT_LANGUAGE_CODE:-vi}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v1}
      ELEVENLABS_TIMEOUT_TTS_MS: ${ELEVENLABS_TIMEOUT_TTS_MS:-30000}
      ELEVENLABS_TIMEOUT_STT_MS: ${ELEVENLABS_TIMEOUT_STT_MS:-600000}
      KAFKA_TOPIC_ANSWER_SUBMITTED: ${KAFKA_TOPIC_ANSWER_SUBMITTED:-answer-submitted}
      KAFKA_TOPIC_TRANSCRIPT_READY: ${KAFKA_TOPIC_TRANSCRIPT_READY:-transcript-ready}
      KAFKA_TOPIC_TRANSCRIPT_FAILED: ${KAFKA_TOPIC_TRANSCRIPT_FAILED:-transcript-failed}
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFMPEG_TMP_DIR: /tmp/tts-stt
    networks: [internal-net]
    depends_on: [storage-service]

  # ─── Judge Service (internal only) ────────────────────────────
  judge-service:
    image: ghcr.io/minhanh-it/mockwise_project/judge-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 8083
      DB_HOST: ${MYSQL_HOST}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: judge
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN}
      JUDGE_CALLBACK_BASE_URL: ${JUDGE_CALLBACK_BASE_URL}
    networks: [internal-net, mockwise-judge-net]

  # ─── API Gateway (bridge: public ↔ internal) ───────────────────
  api-gateway:
    image: ghcr.io/minhanh-it/mockwise_project/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 8888
      IAM_SERVICE_URL: http://iam-service:8081
      USER_PROFILE_SERVICE_URL: http://user-profile-service:8082
      JUDGE_SERVICE_URL: http://judge-service:8083
      QUESTION_BANK_SERVICE_URL: http://question-bank-service:8084
      STORAGE_SERVICE_URL: http://storage-service:8085
      TTS_STT_SERVICE_URL: http://tts-stt-service:8086
      AI_EVALUATION_URL: http://ai-evaluation:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    networks: [public-net, internal-net]
    depends_on: [iam-service, user-profile-service, judge-service, question-bank-service, storage-service, tts-stt-service]

  # ─── AI Evaluation (internal only) ─────────────────────────────
  ai-evaluation:
    image: ghcr.io/minhanh-it/mockwise_project/ai-evaluation:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-gemini-flash-latest}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      MODEL_VERSION: ${MODEL_VERSION:-evaluator-v1.0}
      SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      PORT: 8000
    networks: [internal-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ─── Frontend (internal, served via nginx) ─────────────────────
  frontend:
    image: ghcr.io/minhanh-it/mockwise_project/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal-net]

  # ─── Swagger UI (internal only) ────────────────────────────────
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS: >-
        [{"url":"/api-spec/iam-service.yaml","name":"IAM Service"},
         {"url":"/api-spec/user-profile-service.yaml","name":"User Profile Service"},
         {"url":"/api-spec/judge-service.yaml","name":"Judge Service"},
         {"url":"/api-spec/question-bank-service.yaml","name":"Question Bank Service"},
         {"url":"/api-spec/storage-service.yaml","name":"Storage Service"},
         {"url":"/api-spec/tts-stt-service.yaml","name":"TTS-STT Service"}]
    networks: [internal-net]

  # ─── Nginx (only service exposed to the internet) ─────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../api-spec:/etc/nginx/api-spec:ro
    networks: [public-net, internal-net]
    depends_on: [api-gateway, frontend, swagger-ui]

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
  mockwise-judge-net:
    external: true
