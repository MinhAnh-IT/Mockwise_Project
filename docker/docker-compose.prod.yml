name: mockwise-prod

# Production overrides — use pre-built registry images
# Usage: docker compose -f docker/docker-compose.prod.yml up -d

services:
  api-gateway:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-mockwise}/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  ai-evaluation:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-mockwise}/ai-evaluation:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-mockwise}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  mysql:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  redis:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
