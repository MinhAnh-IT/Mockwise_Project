name: mockwise

# All infrastructure runs externally on VPS (docker-compose.infra.yml).
# App services connect via env vars — no local DB containers needed.
#
# Network topology:
#   public-net  : nginx ↔ api-gateway  (internet-facing)
#   internal-net: api-gateway ↔ all backend services  (no external access)
#
# Only nginx (80/443) and api-gateway (8888) are reachable from outside.
# iam-service, user-profile-service, mail-service, ai-service are
# strictly internal — no ports exposed to the host.

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    # No 'internal: true' — services still need outbound access to VPS (MySQL, Redis, Kafka).
    # Isolation is enforced by NOT exposing ports on host, not by blocking internet.

services:
  # ─── Spring Services (internal only) ───────────────────────────
  iam-service:
    build:
      context: ../services
      dockerfile: iam-service/Dockerfile
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/iam
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
    networks:
      - internal-net
    # No ports — only reachable via api-gateway on internal-net

  user-profile-service:
    build:
      context: ../services
      dockerfile: user-profile-service/Dockerfile
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/user_profile
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      IAM_BASE_URL: http://iam-service:8081/api/v1/iam
    networks:
      - internal-net
    depends_on:
      - iam-service
    # No ports — only reachable via api-gateway on internal-net

  mail-service:
    build:
      context: ../services
      dockerfile: mail-service/Dockerfile
    env_file: ../.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks:
      - internal-net
    # No ports — event-driven via Kafka, no direct HTTP access needed

  # ─── Storage Service (internal only) ───────────────────────────
  storage-service:
    build:
      context: ../services
      dockerfile: storage-service/Dockerfile
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/storage
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-${MINIO_ENDPOINT}}
      MINIO_PROXY_PUBLIC_BASE_URL: ${MINIO_PROXY_PUBLIC_BASE_URL:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - internal-net

  # ─── TTS-STT Service (internal only) ──────────────────────────
  tts-stt-service:
    build:
      context: ../services
      dockerfile: tts-stt-service/Dockerfile
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/tts_stt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STORAGE_SERVICE_BASE_URL: http://storage-service:8085
      STORAGE_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v1}
      ELEVENLABS_TIMEOUT_TTS_MS: ${ELEVENLABS_TIMEOUT_TTS_MS:-30000}
      ELEVENLABS_TIMEOUT_STT_MS: ${ELEVENLABS_TIMEOUT_STT_MS:-600000}
      KAFKA_TOPIC_ANSWER_SUBMITTED: ${KAFKA_TOPIC_ANSWER_SUBMITTED:-answer-submitted}
      KAFKA_TOPIC_TRANSCRIPT_READY: ${KAFKA_TOPIC_TRANSCRIPT_READY:-transcript-ready}
      KAFKA_TOPIC_TRANSCRIPT_FAILED: ${KAFKA_TOPIC_TRANSCRIPT_FAILED:-transcript-failed}
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFMPEG_TMP_DIR: /tmp/tts-stt
    networks:
      - internal-net
    depends_on:
      - storage-service
    # No ports — internal only, callers use api-gateway or service DNS

  # ─── Interview Service (internal only) ────────────────────────
  interview-service:
    build:
      context: ../services
      dockerfile: interview-service/Dockerfile
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/mockwise_interview
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      QUESTION_BANK_BASE_URL: http://question-bank-service:8084/api/v1/question-bank
      STORAGE_BASE_URL: http://storage-service:8085/api/v1/storage
      USER_PROFILE_BASE_URL: http://user-profile-service:8082/api/v1/profiles
      TTS_STT_BASE_URL: http://tts-stt-service:8086/api/v1/tts-stt
      AI_BASE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
    networks:
      - internal-net
    depends_on:
      - question-bank-service
      - storage-service
      - tts-stt-service
      - user-profile-service
      - ai-service

  # ─── Judge Service (internal only) ────────────────────────────
  judge-service:
    build:
      context: ../services/judge-service
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      PORT: 8083
      DB_HOST: ${MYSQL_HOST}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: judge
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN}
      JUDGE_CALLBACK_BASE_URL: ${JUDGE_CALLBACK_BASE_URL}
    networks:
      - internal-net

  # ─── API Gateway (bridge between public and internal) ──────────
  api-gateway:
    build:
      context: ../services
      dockerfile: api-gateway/Dockerfile
    env_file: ../.env
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
      - IAM_SERVICE_URL=http://iam-service:8081
      - USER_PROFILE_SERVICE_URL=http://user-profile-service:8082
      - JUDGE_SERVICE_URL=http://judge-service:8083
      - STORAGE_SERVICE_URL=http://storage-service:8085
      - TTS_STT_SERVICE_URL=http://tts-stt-service:8086
      - INTERVIEW_SERVICE_URL=http://interview-service:8088
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    networks:
      - public-net
      - internal-net   # ← can reach all internal services
    depends_on:
      - iam-service
      - user-profile-service
      - judge-service
      - storage-service
      - tts-stt-service
      - interview-service

  # ─── AI Service (internal only) ────────────────────────────────
  # Single FastAPI service hosting both:
  #   • the evaluation graph   (POST /evaluate, /generate-testcases, /leetcode/fetch)
  #   • the question selector  (POST /selector/next-question, /selector/admin/reindex)
  # The selector half is gated on DATABASE_URL — omit it to run eval-only.
  ai-service:
    build: ../AI
    env_file: ../.env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gemini-flash-latest}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - EVALUATOR_VERSION=${EVALUATOR_VERSION:-evaluator-v1.0}
      - SELECTOR_VERSION=${SELECTOR_VERSION:-selector-v1.0}
      - SERVICE_API_KEY=${AI_SERVICE_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/ai_question_selector
      - KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC_QUESTION_BANK=${KAFKA_TOPIC_QUESTION_BANK:-question-bank-events}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP_SELECTOR:-ai-service-selector}
      - QUESTION_BANK_BASE_URL=http://question-bank-service:8084
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - PORT=8000
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # No ports — only reachable via api-gateway on internal-net

  # ─── Frontend (internal only) ───────────────────────────────────
  frontend:
    build: ../frontend
    env_file: ../.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - internal-net
    # No ports — served via nginx

  # ─── Swagger UI (internal only) ────────────────────────────────
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    environment:
      BASE_URL: /docs
      URLS: >-
        [{"url":"/api-spec/iam-service.yaml","name":"IAM Service"},
         {"url":"/api-spec/user-profile-service.yaml","name":"User Profile Service"},
         {"url":"/api-spec/interview-service.yaml","name":"Interview Service"}]
    networks:
      - internal-net

  # ─── Nginx (only public entry point) ───────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl:/etc/nginx/ssl
      - ../api-spec:/etc/nginx/api-spec:ro
    networks:
      - public-net
      - internal-net   # ← can reach frontend and ai-service
    depends_on:
      - api-gateway
      - ai-service
      - frontend
      - swagger-ui

volumes:
  nginx_ssl:
