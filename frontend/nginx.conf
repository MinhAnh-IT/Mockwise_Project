server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all paths serve index.html so client-side routing works.
    # /api/* requests never reach this container in production: the public
    # nginx (nginx/conf.d/default.conf) proxies them straight to api-gateway.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
