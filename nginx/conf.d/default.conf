# Use Docker's internal DNS resolver; re-resolve every 10s so nginx picks up
# new container IPs automatically after a deployment without needing a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── HTTP ──────────────────────────────────────────────────────────
# Serves ACME challenges for Let's Encrypt and redirects everything else
# to HTTPS. Direct IP access (31.220.84.140) is also accepted on HTTP only
# because Let's Encrypt cannot issue certs for bare IPs.
server {
    listen 80;
    server_name mockwise.io.vn www.mockwise.io.vn;

    # Required for certbot --webroot renewals.
    # Place ACME challenge BEFORE the redirect so renewal HTTP-01 works.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Fallback for direct-IP / unknown-Host access — no redirect (HTTPS-on-IP
# is not trusted), serve the app directly so http://31.220.84.140 keeps working.
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /docs/ {
        set $upstream http://swagger-ui:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-spec/ {
        alias /etc/nginx/api-spec/;
        default_type application/yaml;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        set $upstream http://api-gateway:8888;
        limit_req zone=api burst=20 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        set $upstream http://frontend:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name mockwise.io.vn www.mockwise.io.vn;

    ssl_certificate     /etc/letsencrypt/live/mockwise.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mockwise.io.vn/privkey.pem;

    # Let's Encrypt-recommended TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — only enable after you're sure HTTPS is stable; preload-eligible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /docs/ {
        set $upstream http://swagger-ui:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-spec/ {
        alias /etc/nginx/api-spec/;
        default_type application/yaml;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        set $upstream http://api-gateway:8888;
        limit_req zone=api burst=20 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        set $upstream http://frontend:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
