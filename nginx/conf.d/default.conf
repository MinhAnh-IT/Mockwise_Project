# Use Docker's internal DNS resolver; re-resolve every 10s so nginx picks up
# new container IPs automatically after a deployment without needing a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── HTTP ──────────────────────────────────────────────────────────
# Serves ACME challenges for Let's Encrypt and redirects everything else
# to HTTPS. Direct IP access (31.220.84.140) is also accepted on HTTP only
# because Let's Encrypt cannot issue certs for bare IPs.
server {
    listen 80;
    server_name mockwise.io.vn www.mockwise.io.vn;

    # Required for certbot --webroot renewals.
    # Place ACME challenge BEFORE the redirect so renewal HTTP-01 works.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Fallback for direct-IP / unknown-Host access — no redirect (HTTPS-on-IP
# is not trusted), serve the app directly so http://31.220.84.140 keeps working.
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /docs/ {
        set $upstream http://swagger-ui:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-spec/ {
        alias /etc/nginx/api-spec/;
        default_type application/yaml;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        set $upstream http://api-gateway:8888;
        limit_req zone=api burst=20 nodelay;
        # Override the 20M http-block default so video answer uploads
        # (POST /api/v1/storage/uploads/videos/multipart) can carry a
        # multi-minute 720p webm without hitting 413 at the edge. Storage
        # service caps at 500M; we stay well under that.
        client_max_body_size 200M;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 300s: admin AI testcase generation (up to 100 cases) can run ~2 min.
        proxy_read_timeout 300s;
    }

    # Mirror of the HTTPS /minio/ passthrough — kept here so direct-IP
    # access (http://31.220.84.140/minio/...) works during local dev /
    # initial bring-up before DNS+TLS land on a new host. See the HTTPS
    # block below for comments.
    location /minio/ {
        set $minio_upstream "31.220.84.140:9000";

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain" always;
            return 204;
        }

        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $minio_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # MinIO emits its own CORS headers; strip them so nginx is the
        # single source of truth and the browser doesn't see duplicates.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type" always;
    }

    location / {
        set $upstream http://frontend:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name mockwise.io.vn www.mockwise.io.vn;

    ssl_certificate     /etc/letsencrypt/live/mockwise.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mockwise.io.vn/privkey.pem;

    # Let's Encrypt-recommended TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — only enable after you're sure HTTPS is stable; preload-eligible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /docs/ {
        set $upstream http://swagger-ui:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-spec/ {
        alias /etc/nginx/api-spec/;
        default_type application/yaml;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        set $upstream http://api-gateway:8888;
        limit_req zone=api burst=20 nodelay;
        # Override the 20M http-block default so video answer uploads
        # (POST /api/v1/storage/uploads/videos/multipart) can carry a
        # multi-minute 720p webm without hitting 413 at the edge. Storage
        # service caps at 500M; we stay well under that.
        client_max_body_size 200M;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 300s: admin AI testcase generation (up to 100 cases) can run ~2 min.
        proxy_read_timeout 300s;
    }

    # ─── MinIO presigned passthrough ────────────────────────────────
    # The browser uses presigned URLs of the form:
    #   https://mockwise.io.vn/minio/<bucket>/<key>?X-Amz-Signature=...
    # We strip the /minio/ prefix and forward to the upstream MinIO with
    # Host=$minio_upstream so MinIO's SigV4 validation sees the same host
    # the SDK used when signing (configured via MINIO_PUBLIC_ENDPOINT).
    #
    # CORS is terminated here so we don't need to maintain a bucket policy:
    # preflights return 204 immediately, and CORS response headers are added
    # to every passthrough request as well.
    location /minio/ {
        # MinIO upstream — same value the SDK uses for MINIO_PUBLIC_ENDPOINT.
        # Keep host:port identical so SigV4's host header check passes.
        set $minio_upstream "31.220.84.140:9000";

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain" always;
            return 204;
        }

        # Strip the /minio/ prefix so MinIO sees /<bucket>/<key>.
        rewrite ^/minio/(.*)$ /$1 break;

        proxy_pass http://$minio_upstream;
        proxy_http_version 1.1;
        # SigV4 was computed against this host header — must match exactly.
        proxy_set_header Host $minio_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Browser PUTs can run several hundred MB; let bodies stream
        # straight through without buffering to disk on nginx.
        client_max_body_size 500M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # MinIO emits its own CORS headers; strip them so nginx is the
        # single source of truth and the browser doesn't see duplicates.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type" always;
    }

    location / {
        set $upstream http://frontend:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
