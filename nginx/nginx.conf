user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Don't leak the nginx version in error pages / Server header.
    server_tokens off;

    # ─── Slowloris / slow-POST mitigation ──────────────────────────
    # Drop clients that dribble headers/body to hold a connection open.
    # These are per-read timeouts, not totals, so they don't break slow
    # mobile uploads as long as data keeps flowing.
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;

    # ─── Security headers (applied to responses that don't set their own
    # add_header — i.e. the SPA + API; /minio/ overrides with its own set) ──
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Interview feature needs mic + camera from our own origin only.
    add_header Permissions-Policy     "geolocation=(), microphone=(self), camera=(self)" always;
    # Anti-clickjacking; conservative so it can't break the SPA / CDN assets.
    add_header Content-Security-Policy "frame-ancestors 'self'"         always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Per-IP concurrent-connection cap — blunts connection-flood / slowloris.
    limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

    # Return 429 (not the default 503) when a rate/conn limit trips, so
    # clients and monitoring can tell throttling apart from an outage.
    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
