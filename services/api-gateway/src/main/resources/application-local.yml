spring:
  cloud:
    gateway:
      routes:
        - id: iam-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/iam/**

        - id: ai-evaluation
          uri: http://localhost:8000
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2

        - id: judge-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/judge/**

        - id: tts-stt-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/tts-stt/**

        - id: user-profile-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/**

app:
  iam:
    url: http://localhost:8081
