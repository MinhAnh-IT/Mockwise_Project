spring:
  application:
    name: api-gateway

  main:
    # Force reactive (WebFlux) mode — required for Spring Cloud Gateway.
    # Prevents conflict if spring-webmvc ends up on the classpath transitively.
    web-application-type: reactive

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ORIGIN:*}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

      # Routes (evaluated top-to-bottom — more specific paths first)
      routes:
        - id: iam-service
          uri: ${IAM_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/iam/**

        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2   # /api/ai/evaluate → /evaluate ; /api/ai/selector/next-question → /selector/next-question

        - id: judge-service
          uri: ${JUDGE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/judge/**

        - id: question-bank-service
          uri: ${QUESTION_BANK_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/question-bank/**

        - id: storage-service
          uri: ${STORAGE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/storage/**

        - id: tts-stt-service
          uri: ${TTS_STT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/tts-stt/**

        - id: interview-service
          uri: ${INTERVIEW_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/interviews/**

        - id: practice-service
          uri: ${PRACTICE_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/practice/**

        - id: user-profile-service
          uri: ${USER_PROFILE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/**

server:
  port: ${PORT:8888}

# Service URLs used by AuthGatewayFilter
app:
  iam:
    url: ${IAM_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.mockwise.gateway: DEBUG

# Admin server-monitoring targets. Service URLs reuse the same env the gateway
# already routes with; infra hosts reuse the infra env (must be passed through
# to the gateway container). Any HTTP response = service up; infra is a TCP probe.
monitoring:
  timeout-ms: 2000
  services:
    - name: IAM
      url: ${IAM_SERVICE_URL:http://localhost:8081}/api/v1/iam/auth/health
    - name: User Profile
      url: ${USER_PROFILE_SERVICE_URL:http://localhost:8082}/api/v1/position-tracks
    - name: Interview
      url: ${INTERVIEW_SERVICE_URL:http://localhost:8088}/api/v1/interviews/health
    - name: Practice
      url: ${PRACTICE_SERVICE_URL:http://localhost:8089}/api/v1/practice/health
    - name: Question Bank
      url: ${QUESTION_BANK_SERVICE_URL:http://localhost:8084}/api/v1/question-bank/questions/health
    - name: Judge
      url: ${JUDGE_SERVICE_URL:http://localhost:8083}/actuator/health
    - name: Judge0
      url: ${JUDGE0_BASE_URL:http://localhost:2358}/about
    - name: Storage
      url: ${STORAGE_SERVICE_URL:http://localhost:8085}/api/v1/storage/health
    - name: TTS-STT
      url: ${TTS_STT_SERVICE_URL:http://localhost:8086}/api/v1/tts-stt/health
    - name: Mail
      url: ${MAIL_SERVICE_URL:http://mail-service:8087}/health
    - name: AI Service
      url: ${AI_SERVICE_URL:http://localhost:8000}/health
  infra:
    - name: MySQL
      target: ${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}
    - name: PostgreSQL
      target: ${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}
    - name: Redis
      target: ${REDIS_HOST:redis}:${REDIS_PORT:6379}
    - name: Kafka
      target: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    - name: MinIO
      target: ${MINIO_ENDPOINT:http://minio:9000}
