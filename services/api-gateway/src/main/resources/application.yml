spring:
  application:
    name: api-gateway

  main:
    # Force reactive (WebFlux) mode — required for Spring Cloud Gateway.
    # Prevents conflict if spring-webmvc ends up on the classpath transitively.
    web-application-type: reactive

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ORIGIN:*}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

      # Routes (evaluated top-to-bottom — more specific paths first)
      routes:
        - id: iam-service
          uri: ${IAM_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/iam/**

        - id: ai-evaluation
          uri: ${AI_EVALUATION_URL:http://localhost:8000}
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2   # /api/ai/evaluate → /evaluate

        - id: judge-service
          uri: ${JUDGE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/judge/**

        - id: question-bank-service
          uri: ${QUESTION_BANK_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/question-bank/**

        - id: user-profile-service
          uri: ${USER_PROFILE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/**

server:
  port: ${PORT:8888}

# Service URLs used by AuthGatewayFilter
app:
  iam:
    url: ${IAM_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.mockwise.gateway: DEBUG
