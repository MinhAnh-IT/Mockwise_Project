spring:
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  cloud:
    openfeign:
      lazy-attributes-resolution: true

external:
  services:
    profile-service:
      url: http://localhost:8082/api/v1/profiles

app:
  jwt:
    issuer: mockwise-iam
    audience: mockwise-api
    access-ttl-seconds: 600
    refresh-ttl-seconds: 1209600
    active-kid: rsa-key-2025-10
    JWT_HMAC_SECRET: mockwise-secret-key-32bytes-abcdef123456
    max-refresh-sessions: 5
    cookie-secure: false

  otp:
    key_otp_verify_account: "key_verify_"
    key_otp_forgot_pass: "key_forgot_password_"
    time_expire: 60
