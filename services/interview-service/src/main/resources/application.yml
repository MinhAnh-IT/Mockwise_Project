spring:
  profiles:
    # If no profile is set explicitly (e.g. running the jar locally), fall back
    # to `local` so application-local.yml's hard-coded VPS values are used.
    # In production, compose injects env vars which take precedence over yaml.
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: InterviewHikariPool
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Kafka. The bootstrap-servers env wins so prod can override; bean
  # config (KafkaConfig) reads the same KafkaProperties via Spring Boot.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Same group id across replicas — partitions get split, no double-handling.
      group-id: ${KAFKA_CONSUMER_GROUP_ID:interview-service}

server:
  port: 8088
  servlet:
    context-path: /api/v1/interviews

api:
  response:
    enabled: false

internal:
  auth:
    api-key: ${INTERNAL_API_KEY}

# Outbox poller + topic-name overrides. Defaults match the producers
# we expect from tts-stt-service and the AI service.
interview:
  outbox:
    poll-interval-ms: ${INTERVIEW_OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${INTERVIEW_OUTBOX_BATCH_SIZE:50}
    send-timeout-ms: ${INTERVIEW_OUTBOX_SEND_TIMEOUT_MS:5000}
  kafka:
    topic:
      transcript-ready:    ${KAFKA_TOPIC_TRANSCRIPT_READY:transcript-ready}
      transcript-failed:   ${KAFKA_TOPIC_TRANSCRIPT_FAILED:transcript-failed}
      evaluation-completed: ${KAFKA_TOPIC_EVALUATION_COMPLETED:evaluation-completed}
      evaluation-failed:   ${KAFKA_TOPIC_EVALUATION_FAILED:evaluation-failed}
      session-evaluation-completed: ${KAFKA_TOPIC_SESSION_EVAL_COMPLETED:session-evaluation-completed}
      session-evaluation-failed:    ${KAFKA_TOPIC_SESSION_EVAL_FAILED:session-evaluation-failed}

# URLs to dependent services. Wired into Feign clients as they are added.
external:
  services:
    question-bank:
      url: ${QUESTION_BANK_BASE_URL:http://question-bank-service:8084/api/v1/question-bank}
    storage:
      url: ${STORAGE_BASE_URL:http://storage-service:8085/api/v1/storage}
    user-profile:
      url: ${USER_PROFILE_BASE_URL:http://user-profile-service:8082/api/v1/profiles}
    tts-stt:
      # tts-stt-service mounts every endpoint under /api/v1/tts-stt (servlet
      # context-path), so the Feign URL must include it — otherwise Spring's
      # default 404 page comes back as HTML and the consumer dies trying to
      # parse it as JSON. Other clients (storage, question-bank, user-profile)
      # already include their context path.
      url: ${TTS_STT_BASE_URL:http://tts-stt-service:8086/api/v1/tts-stt}
    ai:
      url: ${AI_BASE_URL:http://ai-service:8000}
      api-key: ${AI_SERVICE_API_KEY:}

logging:
  level:
    org.hibernate.SQL: INFO
