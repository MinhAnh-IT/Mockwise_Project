spring:
  application:
    name: judge-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:judge}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:mockwise}
    password: ${DB_PASSWORD:mockwise_db_password2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: judge-service
      auto-offset-reset: earliest
      # Wrap both deserializers in ErrorHandlingDeserializer so a message that
      # cannot be parsed (e.g. a testCase id that is not a UUID) yields a
      # failed record the container error handler can route to a DLQ, instead
      # of throwing inside the poll loop and becoming a poison pill that blocks
      # the whole consumer forever. See KafkaErrorHandlingConfig.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.interview.judge.*"
        spring.json.value.default.type: com.interview.judge.dto.SubmissionEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

judge0:
  base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
  auth-token: ${JUDGE0_AUTH_TOKEN:}
  # How many times to resubmit a job whose Judge0 callback reports a transient
  # internal error (status 13 Internal Error / 14 Exec Format Error) before
  # giving up and marking the remaining cases RE.
  exec-max-retries: ${JUDGE0_EXEC_MAX_RETRIES:2}
  # Per-batch execution limits. One submission runs ALL of a job's cases in a
  # single process, so these cover the whole batch (not one case). MUST stay
  # ≤ MAX_CPU_TIME_LIMIT / MAX_WALL_TIME_LIMIT in judge0.conf on the VPS, else
  # Judge0 rejects the submission with HTTP 422.
  cpu-time-limit: ${JUDGE0_CPU_TIME_LIMIT:20}
  wall-time-limit: ${JUDGE0_WALL_TIME_LIMIT:30}

judge:
  # host.docker.internal → resolves to host machine from inside Docker containers
  # Judge0 uses this URL to POST results back to /api/v1/judge/callback/{taskId}
  callback-base-url: ${JUDGE_CALLBACK_BASE_URL:http://host.docker.internal:8083}

server:
  port: ${PORT:8083}
