spring:
  datasource:
    url: jdbc:h2:mem:judge;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

judge0:
  base-url: http://judge0-mock-not-used
  auth-token: test-token

judge:
  callback-base-url: http://localhost:0
