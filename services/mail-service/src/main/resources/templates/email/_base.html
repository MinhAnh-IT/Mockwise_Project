<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="${brand} + ' Mail'">MockWise Mail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Inline CSS thân thiện mail client */
        .container{max-width:560px;margin:24px auto;padding:24px;border:1px solid #eaeaea;border-radius:12px;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#ffffff}
        .brand{font-size:20px;font-weight:700;margin-bottom:12px}
        .card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin:16px 0}
        .otp{font-size:28px;letter-spacing:6px;font-weight:700;text-align:center;padding:12px 0}
        .btn{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;border:1px solid #111827}
        .muted{color:#6b7280;font-size:12px}
    </style>
</head>
<body style="background:#f3f4f6;padding:16px;">
<div class="container">
    <div class="brand" th:text="${brand}">MockWise</div>
    <div th:replace="~{${contentTemplate} :: body}"></div>
    <p class="muted">If you didn’t request this, you can ignore this email.</p>
</div>
</body>
</html>
