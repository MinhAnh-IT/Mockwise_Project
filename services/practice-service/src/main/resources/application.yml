spring:
  profiles:
    # No explicit profile (e.g. running the jar locally) → fall back to `local`
    # so application-local.yml's dev values are used. In prod, compose injects
    # env vars which take precedence over yaml.
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/practice}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: PracticeHikariPool
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Route all Feign clients through OkHttp (pooled + keep-alive).
  cloud:
    openfeign:
      okhttp:
        enabled: true

  # Kafka — produce code-submission, consume submission-judged.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:practice-service}

server:
  port: 8089
  servlet:
    context-path: /api/v1/practice

api:
  response:
    enabled: false

# Shared secret for service-to-service /internal/** calls (e.g. question-bank
# internal catalog). Injected into outbound Feign requests as X-Internal-Auth.
internal:
  auth:
    api-key: ${INTERNAL_API_KEY:}

# Practice tunables.
practice:
  run:
    # Max source size accepted by /run and /submit (256KB) — matches interview.
    max-code-bytes: ${PRACTICE_MAX_CODE_BYTES:262144}
  # Languages judge-service / Judge0 can execute. A submission outside this set
  # is rejected with LANGUAGE_NOT_SUPPORTED before any Kafka dispatch.
  languages: ${PRACTICE_LANGUAGES:java,python,cpp,javascript}
  # A submission left in JUDGING longer than this (judge crashed / verdict lost)
  # is swept to FAILED by the watchdog. Interval is the sweep cadence.
  watchdog:
    timeout-seconds: ${PRACTICE_JUDGING_TIMEOUT_SECONDS:120}
    interval-ms: ${PRACTICE_WATCHDOG_INTERVAL_MS:30000}
  kafka:
    topic:
      code-submission:  ${KAFKA_TOPIC_CODE_SUBMISSION:code-submission}
      submission-judged: ${KAFKA_TOPIC_SUBMISSION_JUDGED:submission-judged}

# Dependent services. The question-bank URL includes its context-path so the
# Feign client paths (/internal/coding-problems/...) resolve correctly.
external:
  services:
    question-bank:
      url: ${QUESTION_BANK_BASE_URL:http://question-bank-service:8084/api/v1/question-bank}

logging:
  level:
    org.hibernate.SQL: INFO
