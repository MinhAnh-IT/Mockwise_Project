spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: QuestionBankHikariPool
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8084
  servlet:
    context-path: /api/v1/question-bank

api:
  response:
    enabled: false

# Sync TTS call after admin creates / updates a behavioral or core question.
# Failures are logged but do NOT block question creation.
tts-client:
  base-url: ${TTS_STT_SERVICE_URL:http://tts-stt-service:8086}
  internal-api-key: ${INTERNAL_API_KEY:}
  connect-timeout-ms: ${TTS_CLIENT_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${TTS_CLIENT_READ_TIMEOUT_MS:30000}
  enabled: ${TTS_CLIENT_ENABLED:true}
  default-language-code: ${TTS_DEFAULT_LANGUAGE_CODE:vi}

logging:
  level:
    org.hibernate.SQL: DEBUG
