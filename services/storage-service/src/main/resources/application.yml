spring:
  profiles:
    # If no profile is set explicitly (e.g. running the jar locally), fall back
    # to `local` so application-local.yml's hard-coded VPS values are used.
    # In production, compose injects env vars which take precedence over yaml.
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: StorageHikariPool
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8085
  servlet:
    context-path: /api/v1/storage

api:
  response:
    enabled: false

minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  region: ${MINIO_REGION:us-east-1}
  buckets:
    interview-video: ${MINIO_BUCKET_INTERVIEW_VIDEO:interview-videos}
    question-audio: ${MINIO_BUCKET_QUESTION_AUDIO:question-audio}
  presign:
    upload-ttl-seconds: 600     # 10 min — PUT video
    download-ttl-seconds: 1800  # 30 min — GET video
    audio-ttl-seconds: 60       # 60s — GET question audio
  upload-limits:
    video-max-bytes: 524288000  # 500 MB
    audio-max-bytes: 26214400   # 25 MB

internal:
  auth:
    api-key: ${INTERNAL_API_KEY}

logging:
  level:
    org.hibernate.SQL: INFO
