spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: UFHikariPool
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8082
  servlet:
    context-path: /api/v1

mockwise:
  iam:
    base-url: ${IAM_BASE_URL:http://localhost:8081/api/v1/iam}
  storage:
    # Internal-network base URL for storage-service. /internal/** endpoints are
    # gated by the X-Internal-Auth header injected by StorageFeignConfig.
    base-url: ${STORAGE_SERVICE_INTERNAL_URL:http://localhost:8085/api/v1/storage}
    internal-api-key: ${INTERNAL_API_KEY:}
    # TTL we ask storage-service to mint avatar GET URLs for. Storage caps it
    # at avatar-ttl-seconds (10 min by default) regardless of what we request.
    avatar-ttl-seconds: ${STORAGE_AVATAR_TTL_SECONDS:600}

api:
  response:
    enabled: false
